name: Build OpenWrt APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          # ubuntu-latest sudah membawa Android SDK di $ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "SDKMGR_BIN=$SDKMGR" >> "$GITHUB_ENV"
          "$SDKMGR" --version

      - name: Accept Android licenses
        run: yes | "$SDKMGR_BIN" --licenses >/dev/null || true

      - name: Install required SDK packages
        run: |
          "$SDKMGR_BIN" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --warning-mode=none

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found: $APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Control-Debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
