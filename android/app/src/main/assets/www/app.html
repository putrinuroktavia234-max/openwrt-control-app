<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>OpenWrt</title>
<style>
@font-face{font-family:'SG';src:url('fonts/sg-500.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'SG';src:url('fonts/sg-700.woff2') format('woff2');font-weight:700;font-display:swap}
:root{
 --ink:#0c0d10;--surf:#17181d;--raise:#1e2026;--hair:rgba(255,255,255,.075);
 --t1:#f2f1ee;--t2:#9b9d9f;--t3:#5d6065;
 --amber:#e9b44c;--ok:#8fc98a;--bad:#e0807f;--r:12px;--r-lg:18px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ink);color:var(--t1);font-family:'SG',system-ui,sans-serif;
 overflow:hidden;-webkit-font-smoothing:antialiased}
.app{max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.top{flex:0 0 auto;padding:calc(16px + env(safe-area-inset-top)) 22px 10px;
 display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.top .sub{font-size:11.5px;font-weight:500;color:var(--t3);margin-top:3px;letter-spacing:.02em;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.chip{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:500;color:var(--t3);
 letter-spacing:.05em;padding:7px 11px;border:1px solid var(--hair);border-radius:99px;
 background:var(--surf);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--t3)}
.chip.on i{background:var(--ok);box-shadow:0 0 8px rgba(143,201,138,.6)}
.chip.on span{color:var(--t2)}
.chip.off i{background:var(--bad)}
.view{flex:1;overflow-y:auto;padding:4px 22px calc(100px + env(safe-area-inset-bottom));scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.card{background:var(--surf);border:1px solid var(--hair);border-radius:var(--r-lg);
 padding:15px;margin-bottom:12px}
.card h3{font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
 color:var(--t3);margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--raise);border-radius:var(--r);padding:13px 14px}
.stat .v{font-size:18px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-size:11px;font-weight:500;color:var(--t2)}
.stat .l{font-size:10px;font-weight:500;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.07);margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--amber);transition:width .5s ease}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;
 border-bottom:1px solid var(--hair);font-size:13.5px;font-weight:500}
.row:last-child{border-bottom:none}
.row .k{color:var(--t2)}
.row .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ifc{border-left:2.5px solid var(--amber);padding-left:12px;margin-bottom:14px}
.ifc:last-child{margin-bottom:2px}
.ifc .nm{font-size:14px;font-weight:700}
.tag{display:inline-block;font-size:9px;font-weight:500;letter-spacing:.05em;color:var(--amber);
 border:1px solid rgba(233,180,76,.35);border-radius:99px;padding:2.5px 8px;margin-left:7px;vertical-align:2px}
.tag.g{color:var(--ok);border-color:rgba(143,201,138,.35)}
.tag.r{color:var(--bad);border-color:rgba(224,128,127,.4)}
.dev{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--hair);cursor:pointer}
.dev:last-child{border-bottom:none}
.dev .av{width:36px;height:36px;border-radius:10px;background:var(--raise);border:1px solid var(--hair);
 display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--t2)}
.dev .nm{font-size:13.5px;font-weight:700}
.dev .mc{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums;margin-top:2px}
.dev .ip{margin-left:auto;text-align:right;font-size:12px;font-weight:500;color:var(--t2);font-variant-numeric:tabular-nums}
.empty{padding:26px 8px;text-align:center;color:var(--t3);font-size:12.5px;font-weight:500;line-height:1.6}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:10.5px;font-weight:500;letter-spacing:.06em;color:var(--t3);
 text-transform:uppercase;margin-bottom:7px}
.fld .in{display:flex;align-items:center;background:var(--raise);border:1px solid transparent;
 border-radius:var(--r);height:48px;transition:border-color .18s}
.fld .in:focus-within{border-color:rgba(233,180,76,.55)}
.fld input{flex:1;background:none;border:none;outline:none;color:var(--t1);
 font:700 14px/1 'SG',sans-serif;padding:0 14px;min-width:0}
.fld input::placeholder{color:var(--t3);font-weight:500}
.btn{width:100%;height:48px;border:none;border-radius:var(--r);cursor:pointer;
 background:linear-gradient(180deg,var(--amber),#d49f33);color:#191510;
 font:700 14px 'SG',sans-serif;margin-top:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
 transition:transform .08s;font-family:'SG',sans-serif}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--raise);color:var(--t1);border:1px solid var(--hair);box-shadow:none;font-weight:500}
.act{display:flex;align-items:center;gap:12px;width:100%;background:var(--raise);border:1px solid var(--hair);
 border-radius:var(--r);padding:13px 14px;margin-bottom:9px;color:var(--t1);
 font:700 13.5px 'SG',sans-serif;text-align:left;cursor:pointer}
.act svg{width:18px;height:18px;stroke:var(--amber);fill:none;stroke-width:1.8;flex:0 0 auto}
.act .t{color:var(--t3);font:500 11.5px 'SG',sans-serif;margin-left:auto;white-space:nowrap}
.act.d{color:var(--bad)}.act.d svg{stroke:var(--bad)}
.toggle{position:relative;width:42px;height:24px;border-radius:12px;background:rgba(255,255,255,.12);
 border:none;cursor:pointer;transition:background .2s;flex:0 0 auto}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
 background:var(--t2);transition:transform .22s cubic-bezier(.34,1.3,.64,1),background .2s}
.toggle.on{background:rgba(233,180,76,.35)}
.toggle.on::after{transform:translateX(18px);background:var(--amber)}
.skel{background:linear-gradient(90deg,var(--surf),#1d1f26,var(--surf));background-size:400% 100%;
 animation:sk 1.3s infinite;border-radius:var(--r-lg);height:92px;margin-bottom:12px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
pre.out{background:var(--raise);border:1px solid var(--hair);border-radius:var(--r);padding:12px;
 font:500 10.5px/1.55 ui-monospace,monospace;color:var(--t2);margin-top:10px;
 white-space:pre-wrap;word-break:break-all}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(14px);
 background:#26282f;border:1px solid var(--hair);color:var(--t1);font-size:12.5px;font-weight:500;
 padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;z-index:9;pointer-events:none;max-width:88%;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
 background:rgba(15,16,19,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
 border-top:1px solid var(--hair);display:flex;padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;
 background:none;border:none;color:var(--t3);font:500 9.5px 'SG',sans-serif;cursor:pointer}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--amber)}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.bar i,.toggle{transition:none}}
</style></head><body>

<script>
'use strict';
/* ===== bridge ke Activity Java ===== */
var seq=0,cbs={};
function __cb(id,s){var f=cbs[id];delete cbs[id];if(f)f(s)}
function rpc(ns,m,p){return new Promise(function(res,rej){
  var id=++seq;
  cbs[id]=function(raw){var o;try{o=JSON.parse(raw)}catch(e){return rej(new Error('bad json'))}
    if(o.error)rej(new Error(o.error.message||'error'));
    else{var r=o.result;
      if(Object.prototype.toString.call(r)==='[object Array]'){
        if(+r[0]!==0)return rej(new Error('rpc '+(r[1]||r[0])));
        r=r.length>1?r[1]:{}}
      res(r===undefined?null:r)}};
  try{App.rpc(ns,m,JSON.stringify(p||{}),id)}catch(e){rej(new Error('no bridge'))}
})}
function sh(cmd){return rpc('file','exec',{command:cmd}).then(function(r){
  if(typeof r==='string')return r;
  if(r&&r.stdout!==undefined)return r.stdout;
  return r?String(r):''})}
function shell(js){return sh(['sh','-c',js])}

/* ===== mock utk pratinjau desktop (?mock=1) ===== */
if(!window.App&&location.search.indexOf('mock')>=0){
 window.App={rpc:function(ns,m,p,id){setTimeout(function(){
   var r={};try{if(typeof p==='string')p=JSON.parse(p)}catch(e){p={}}
   if(ns==='system'&&m==='board')r={board_name:'Xiaomi_MIBOX3',kernel:'5.15.137',hostname:'OpenWrt',
     uptime:1599129,localtime:1758502140,release:{distribution:'OpenWrt',openwrt:'23.05.4'},
     memory:{total:932646912,free:398368896,buffers:24117248,cached:118468608}};
   if(ns==='network.interface'&&m==='dump')r={interface:[
     {interface:'loop',device:'lo',proto:'static',up:true},
     {interface:'lan',device:'br-lan',up:true,'l3_device':'br-lan',proto:'static'},
     {interface:'wan',device:'wsap0',up:true,'l3_device':'wsap0',proto:'dhcp'}]};
   if(ns==='network.interface'&&m==='status'){var i=p&&p.interface;
     r=i==='wan'?{interface:'wan',up:true,'l3_device':'wsap0',device:'wsap0',proto:'dhcp',
       'ipv4-address':[{address:'10.42.180.84',mask:24}],route:[{target:'0.0.0.0',nexthop:'10.42.180.1'}],
       dns:['10.42.180.1'],uptime:812450,data:{rx_bytes:8214967296,tx_bytes:612145203}}:
      i==='lan'?{interface:'lan',up:true,'l3_device':'br-lan',device:'br-lan',
       'ipv4-address':[{address:'192.168.1.1',mask:24}]}:{interface:i,up:false}}
   if(ns==='network.wireless'&&m==='status')r={radio0:{up:true,'network-device':'wlan0',sections:['default'],
     current:{channel:6,frequency:2437,ssid:'KRISTAL-24G',mode:'Ap',encryption:'psk2',htmode:'HT20'},
     associated:[{mac:'AA:BB:CC:11:22:33'},{mac:'AA:BB:CC:44:55:66'}]},
     radio1:{up:false,'network-device':'wlan1',sections:['fwwan'],current:null,associated:[]}};
   if(ns==='network.device'&&m==='status')r={'br-lan':{name:'br-lan',type:'bridge',stats:{rx_bytes:961520384,tx_bytes:1484210331}},
     'eth0':{name:'eth0',stats:{rx_bytes:1489322512,tx_bytes:942114520}},
     'wlan0':{name:'wlan0',stats:{rx_bytes:512114520,tx_bytes:128368602}},
     'wsap0':{name:'wsap0',stats:{rx_bytes:8214967296,tx_bytes:612145203}}};
   if(ns==='file'&&m==='exec'){var c=(p.command||[]).join(' ');
     if(c.indexOf('dhcp.leases')>=0)r='1758588140 AA:BB:CC:11:22:33 192.168.1.50 HP-Ali *\n1758588140 AA:BB:CC:44:55:66 192.168.1.63 TV-Ruang *';
     else if(c.indexOf('loadavg')>=0)r='0.34 0.21 0.12 1/123 4567';
     else if(c.indexOf('uci show')>=0)r="wireless.wlan0='wifi-device'\nwireless.wlan0.channel='6'\nwireless.wlan0.htmode='HT20'\nwireless.wlan0.disabled='0'\nwireless.radio0='wifi-device'\nwireless.radio0.channel='auto'\nwireless.radio0.disabled='1'\nwireless.default='wifi-iface'\nwireless.default.device='wlan0'\nwireless.default.network='lan'\nwireless.default.mode='ap'\nwireless.default.ssid='KRISTAL-24G'\nwireless.default.encryption='psk2'\nwireless.default.key='rahasia123'\nwireless.fwwan='wifi-iface'\nwireless.fwwan.device='radio0'\nwireless.fwwan.network='wan'\nwireless.fwwan.mode='sta'\nwireless.fwwan.ssid='MI9-Tether'\nwireless.fwwan.encryption='none'\n";
     else if(c.indexOf('ping')>=0)r='PING 8.8.8.8 (8.8.8.8): 56 data bytes\n64 bytes from 8.8.8.8: seq=0 ttl=118 time=14.21 ms\n64 bytes from 8.8.8.8: seq=1 ttl=118 time=12.90 ms\n\n3 packets transmitted, 2 received, 33% loss\n';
     else r=''}
   __cb(id,JSON.stringify({result:r}))},220)},
  openWeb:function(){},changeHost:function(){},goLogin:function(){},toast:function(t){msg(t)},back:function(){}};
}

/* ===== util ===== */
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function human(b){if(b==null||isNaN(b))return'—';var u=['B','KB','MB','GB','TB'],i=0;
 while(b>=1024&&i<4){b/=1024;i++}return(b>=100?Math.round(b):b.toFixed(1))+' '+u[i]}
function fmtUp(n){n=+n;if(isNaN(n))return'—';
 var d=Math.floor(n/86400),h=Math.floor(n%86400/3600),m=Math.floor(n%3600/60);
 if(d>0)return d+'h '+h+'j';if(h>0)return h+'j '+m+'m';return m+'m'}
function pct(a,b){return b?Math.min(100,Math.max(2,Math.round(a/b*100))):0}
var _tm;function msg(t){var e=$('#toast');e.textContent=t;e.classList.add('show');
 clearTimeout(_tm);_tm=setTimeout(function(){e.classList.remove('show')},2300)}
function rows(d){var h='';for(var i=0;i<d.length;i++)
 h+='<div class="row"><span class="k">'+esc(d[i][0])+'</span><span class="v">'+esc(d[i][1]==null||d[i][1]===''?'—':d[i][1])+'</span></div>';return h}
function skel(n){var h='';for(var i=0;i<n;i++)h+='<div class="skel"></div>';return h}
function svg(p){return'<svg viewBox="0 0 24 24">'+p+'</svg>'}
var IC={home:svg('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>'),
 wifi:svg('<path d="M4 9a11.5 11.5 0 0 1 16 0M7.2 12.4a7 7 0 0 1 9.6 0M10.4 15.6a2.6 2.6 0 0 1 3.2 0"/><circle cx="12" cy="18.6" r=".8"/>'),
 net:svg('<rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><circle cx="7" cy="7.5" r=".8"/><circle cx="7" cy="16.5" r=".8"/>'),
 dev:svg('<rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M10.5 18.5h3"/>'),
 sys:svg('<circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.4 5.4l1.9 1.9M16.7 16.7l1.9 1.9M18.6 5.4l-1.9 1.9M7.3 16.7l-1.9 1.9"/>'),
 reboot:svg('<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/>'),
 panel:svg('<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 9l2.5 2.5L7 14M12 14h5"/>')}

/* ===== state ===== */
var cache={board:null,ifaces:[],st:{},wifi:null,dev:null,leases:null,load:'',uci:null};
var tab=(location.hash||'#home').slice(1);
if(['home','wifi','net','dev','sys'].indexOf(tab)<0)tab='home';
var TABS=[['home','Beranda',IC.home],['wifi','WiFi',IC.wifi],['net','Jaringan',IC.net],
          ['dev','Perangkat',IC.dev],['sys','Sistem',IC.sys]];
var TITLES={home:'Router',wifi:'WiFi',net:'Jaringan',dev:'Perangkat',sys:'Sistem'};

function parseLeases(txt){
 if(!txt||txt.indexOf('No such')>=0)return[];
 return txt.trim().split('\n').filter(function(l){return l.trim()}).map(function(l){
  var p=l.trim().split(/\s+/);
  return{expires:+p[0],mac:p[1]||'',ip:p[2]||'',hostname:p[3]&&p[3]!=='*'?p[3]:''}})}
function parseUci(txt){
 var o={};
 (txt||'').split('\n').forEach(function(l){
  var m=l.match(/^(\w+)\.(\w+)(?:\.(\w+))?='([^']*)'$/);
  if(!m)return;
  var sec=m[1]+'.'+m[2];o[sec]=o[sec]||{};
  if(m[3])o[sec][m[3]]=m[4];else o[sec].__type=m[4]});
 return o}
function wanList(){return cache.ifaces.filter(function(i){
 var s=cache.st[i.interface];return s&&s.up&&(s.route||[]).some(function(r){return r.target==='0.0.0.0'})})}

/* ===== layar ===== */
function screenHome(){
 var b=cache.board,w=cache.wifi,wan=wanList()[0],sw=wan?cache.st[wan.interface]:null;
 var used=b?b.memory.total-(b.memory.free+(b.memory.buffers||0)+(b.memory.cached||0)):0;
 var clients=cache.leases?cache.leases.length:0;
 var wup=w?Object.keys(w).filter(function(k){return w[k]&&w[k].up}).length:0;
 var h='<div class="card"><h3>Ringkasan</h3><div class="grid2">'+
 '<div class="stat"><div class="v">'+esc(b?fmtUp(b.uptime):'—')+'</div><div class="l">Uptime</div></div>'+
 '<div class="stat"><div class="v">'+clients+'</div><div class="l">Perangkat</div></div>'+
 '<div class="stat"><div class="v">'+wup+'<small>/'+(w?Object.keys(w).length:0)+'</small></div><div class="l">Radio aktif</div></div>'+
 '<div class="stat"><div class="v">'+esc(sw&&sw['ipv4-address']?sw['ipv4-address'][0].address:'—')+'</div><div class="l">IP Internet</div></div></div>'+
 '<div style="font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin-top:12px">'+
 'Memori '+(b?human(used)+' / '+human(b.memory.total):'')+'</div>'+
 '<div class="bar"><i style="width:'+(b?pct(used,b.memory.total):0)+'%"></i></div>'+
 rows([['Beban CPU (1/5/15 mnt)',cache.load||'—'],['Internet via',wan?wan.interface+' · '+(cache.st[wan.interface]['l3_device']||''):'—']])+'</div>';
 if(w)for(var k in w){var r=w[k];if(!r||!r.current)continue;var c=r.current;
  h+='<div class="card"><h3>'+esc(k)+' · '+(r.up?'aktif':'mati')+'</h3>'+rows([
   ['Nama',c.ssid],['Klien',(r.associated||[]).length+' perangkat'],
   ['Kanal',c.frequency?c.frequency+' MHz · ch '+c.channel:''],
   ['Keamanan',c.encryption==='none'?'terbuka':c.encryption]])+'</div>'}
 if(!b)h+='<div class="empty">Router tidak merespons.<br>Pastikan HP tersambung ke WiFi router.</div>';
 return h}

function screenWifi(){
 var w=cache.wifi,u=cache.uci;
 if(!u)return skel(3);
 var h='';
 if(w)for(var k in w){var r=w[k];if(!r)continue;
  h+='<div class="card" style="display:flex;align-items:center;gap:12px">'+
  '<div style="flex:1"><h3 style="margin:0">'+esc(k)+'</h3><div style="font-size:12px;font-weight:500;color:var(--t2);margin-top:2px">'+
  esc((r.current&&r.current.ssid)||r['network-device']||'')+'</div></div>'+
  '<button class="toggle '+(r.up?'on':'')+'" data-radio="'+esc(k)+'"></button></div>'}
 Object.keys(u).forEach(function(sec){var c=u[sec];
  if(c.__type==='wifi-iface'){
   h+='<div class="card"><h3>'+(c.mode==='sta'?'Klien wireless (mode station)':'Titik akses (AP)')+'</h3>'+
   '<div class="fld"><label>Nama jaringan (SSID)</label><div class="in">'+
   '<input data-sec="'+esc(sec)+'" data-opt="ssid" value="'+esc(c.ssid||'')+'" placeholder="isi nama WiFi"></div></div>'+
   (c.encryption&&c.encryption!=='none'
    ?'<div class="fld"><label>Kata sandi WiFi</label><div class="in"><input data-sec="'+esc(sec)+'" data-opt="key" type="password" value="'+esc(c.key||'')+'" placeholder="••••••••"></div></div>'
    :'<div class="fld"><label>Enkripsi</label><div class="in"><input disabled value="terbuka — tanpa sandi" style="color:var(--t3)"></div></div>')+
   rows([['Radio',c.device],['Gabung jaringan',c.network],['Mode',c.mode]])+
   '<button class="btn ghost" data-saveiface="'+esc(sec)+'">Simpan perubahan</button></div>'}
 });
 Object.keys(u).forEach(function(sec){var c=u[sec];
  if(c.__type==='wifi-device'){
   h+='<div class="card"><h3>Radio '+esc(sec.split('.')[1])+'</h3>'+
   '<div class="fld"><label>Kanal (0/auto = otomatis)</label><div class="in">'+
   '<input data-sec="'+esc(sec)+'" data-opt="channel" value="'+esc(c.channel||'auto')+'"></div></div>'+
   '<div class="fld"><label>Lebar kanal (HT20 / HT40 / V80)</label><div class="in">'+
   '<input data-sec="'+esc(sec)+'" data-opt="htmode" value="'+esc(c.htmode||'HT20')+'"></div></div>'+
   '<div class="row"><span class="k">Radio dimatikan</span><button class="toggle '+(c.disabled==='1'?'on':'')+'" data-devoff="'+esc(sec)+'"></button></div>'+
   '<button class="btn ghost" data-savedev="'+esc(sec)+'">Simpan radio</button></div>'}
 });
 return h}

function screenNet(){
 var list=cache.ifaces.filter(function(i){return i.interface!=='loop'&&i.device!=='lo'});
 if(!list.length)return skel(3);
 var wans=wanList(),h='<div class="card"><h3>Internet / Modem</h3>';
 var show=wans.length?wans:list;
 show.forEach(function(i){var s=cache.st[i.interface]||{};
  var dev=s['l3_device']||s.device||i.device||'';
  var modem=/wsap|wwan|usb|rndis|ecm|hs\d|tty/i.test(dev);
  var gw=(s.route||[]).filter(function(r){return r.target==='0.0.0.0'})[0];
  h+='<div class="ifc"><div class="nm">'+esc(i.interface)+
   '<span class="tag '+(s.up?'g':'r')+'">'+(s.up?'AKTIF':'MATI')+'</span>'+
   (modem?'<span class="tag">MODEM HP</span>':'')+'</div>'+
   rows([['Perangkat',dev],['Protokol',i.proto],
    ['IPv4',s['ipv4-address']&&s['ipv4-address'][0]?s['ipv4-address'][0].address+'/'+s['ipv4-address'][0].mask:''],
    ['Gerbang',gw?gw.nexthop:''],['DNS',(s.dns||[]).join(' · ')],
    ['Aktif',s.uptime?fmtUp(s.uptime):''],
    ['Turun / Naik',s.data?human(s.data.rx_bytes)+' / '+human(s.data.tx_bytes):'']])+'</div>'});
 h+='</div>';
 var others=list.filter(function(x){return x.interface!=='lan'&&!wans.some(function(w2){return w2.interface===x.interface})});
 var lan=list.filter(function(x){return x.interface==='lan'})[0];
 if(lan){var sl=cache.st.lan||{};
  h+='<div class="card"><h3>LAN</h3>'+rows([['Perangkat',sl['l3_device']||lan.device],
   ['IPv4',sl['ipv4-address']&&sl['ipv4-address'][0]?sl['ipv4-address'][0].address+'/'+sl['ipv4-address'][0].mask:''],
   ['Status',sl.up?'naik':'mati']])+'</div>'}
 if(others.length){h+='<div class="card"><h3>Antarmuka lain</h3>'+others.map(function(i){
   var s=cache.st[i.interface]||{};
   return'<div class="row"><span class="k">'+esc(i.interface)+' <small style="color:var(--t3)">'+esc(i.device||'')+'</small></span>'+
    '<span class="v" style="color:'+(s.up?'var(--ok)':'var(--t3)')+'">'+(s.up?'naik':'mati')+'</span></div>'}).join('')+'</div>'}
 if(cache.dev){h+='<div class="card"><h3>Trafik fisik</h3>'+
  Object.keys(cache.dev).filter(function(d){return d!=='lo'}).slice(0,8).map(function(d){
   var st=(cache.dev[d]||{}).stats||{};
   return'<div class="row"><span class="k">'+esc(d)+'</span><span class="v">↓'+human(st.rx_bytes)+' ↑'+human(st.tx_bytes)+'</span></div>'}).join('')+'</div>'}
 return h}

function screenDev(){
 var ls=cache.leases;
 if(ls===null)return skel(3);
 if(!ls.length)return'<div class="empty">Belum ada klien DHCP terdaftar.</div>';
 return'<div class="card"><h3>Terhubung · '+ls.length+'</h3>'+ls.map(function(x,i){
  var nm=x.hostname||x.mac.split(':').slice(-3).join('-');
  return'<div class="dev" data-kick="'+i+'"><div class="av">'+esc(nm.slice(0,2).toUpperCase())+'</div>'+
   '<div style="min-width:0"><div class="nm">'+esc(nm)+'</div><div class="mc">'+esc(x.mac)+'</div></div>'+
   '<div class="ip">'+esc(x.ip||'')+'</div></div>'}).join('')+
 '</div><div class="empty" style="padding-top:4px">Ketuk perangkat untuk memutus sambungnya (kick).</div>'}

function screenSys(){
 var b=cache.board;
 var h='<div class="card"><h3>Perangkat</h3>'+rows([
  ['Model',b&&b.board_name],['Firmware',b&&b.release?b.release.distribution+' '+b.release.openwrt:''],
  ['Kernel',b&&b.kernel],['Hostname',b&&b.hostname],
  ['Waktu router',b&&b.localtime?new Date(b.localtime*1000).toLocaleString('id-ID',{hour12:false}):'']])+'</div>';
 h+='<div class="card"><h3>Uji koneksi (ping dari router)</h3>'+
  '<div class="fld"><div class="in"><input id="pingHost" value="8.8.8.8" placeholder="8.8.8.8 atau nama situs"></div></div>'+
  '<button class="btn ghost" id="pingGo">Ping 3×</button><pre class="out" id="pingOut" style="display:none"></pre></div>';
 h+='<div class="card"><h3>Tindakan</h3>'+
  '<button class="act" data-act="reload">'+IC.wifi+'Muat ulang WiFi<span class="t">±5 dtk</span></button>'+
  '<button class="act" data-act="web">'+IC.panel+'Buka panel LuCI lengkap<span class="t">semua setting</span></button>'+
  '<button class="act" data-act="host">'+IC.net+'Ganti alamat router</button>'+
  '<button class="act d" data-act="reboot">'+IC.reboot+'Reboot router<span class="t">±1 mnt</span></button>'+
  '<button class="act d" data-act="out">Keluar<span class="t">ganti akun / IP</span></button></div>';
 return h}

/* ===== data ===== */
function loadAll(){
 return Promise.allSettled([
  rpc('system','board',{}).then(function(r){cache.board=r}),
  rpc('network.wireless','status',{}).then(function(r){cache.wifi=r}),
  rpc('network.device','status',{}).then(function(r){cache.dev=r}),
  sh(['cat','/tmp/dhcp.leases']).then(function(s){cache.leases=parseLeases(s)}),
  sh(['cat','/proc/loadavg']).then(function(s){cache.load=(s||'').trim().split(/\s+/).slice(0,3).join(' / ')}),
  rpc('network.interface','dump',{}).then(function(r){
    cache.ifaces=(r&&r.interface)||[];
    return Promise.allSettled(cache.ifaces.slice(0,6).map(function(i){
      return rpc('network.interface','status',{interface:i.interface}).
       then(function(s){cache.st[i.interface]=s})}))} ),
  sh(['uci','show','wireless']).then(function(s){cache.uci=parseUci(s)})
 ])}

/* ===== aksi ===== */
function q(s){return"'"+String(s).replace(/'/g,"'\\''")+"'"}
function uciApplySec(sec,vals,extra){
 var parts=[];
 for(var k in vals){if(vals[k]===undefined||vals[k]===null||vals[k]==='')continue;
  parts.push('uci set '+q(sec+'.'+k)+'='+q(vals[k]))}
 if(extra)parts=parts.concat(extra);
 if(!parts.length){msg('Tidak ada perubahan');return Promise.resolve()}
 parts.push('uci commit wireless','uci reapply wireless');
 return shell(parts.join(' && ')).then(function(){msg('Tersimpan & diterapkan')}).
  catch(function(){return shell(parts.slice(0,-1).concat(['uci commit wireless','/etc/init.d/network reload']).join(' && ')).
   then(function(){msg('Tersimpan (reload penuh)')})})}

function collect(sec){
 var vals={};
 document.querySelectorAll('[data-sec="'+sec+'"]').forEach(function(inp){vals[inp.dataset.opt]=inp.value});
 return vals}

function bind(){
 document.querySelectorAll('[data-radio]').forEach(function(t){t.addEventListener('click',function(){
  var k=t.dataset.radio,up=!t.classList.contains('on');t.classList.toggle('on',up);
  rpc('network.wireless',up?'up':'down',{interface:k}).
   then(function(){msg('Radio '+k+(up?' aktif':' dimatikan'));setTimeout(refresh2,1600)}).
   catch(function(){t.classList.toggle('on',!up);msg('Gagal mengubah radio')})})});
 document.querySelectorAll('[data-saveiface]').forEach(function(b){b.addEventListener('click',function(){
  b.textContent='Menyimpan…';
  uciApplySec(b.dataset.saveiface,collect(b.dataset.saveiface)).
   then(function(){b.textContent='Simpan perubahan';refresh2()}).
   catch(function(){b.textContent='Simpan perubahan';msg('Gagal menyimpan')})})});
 document.querySelectorAll('[data-savedev]').forEach(function(b){b.addEventListener('click',function(){
  var sec=b.dataset.savedev,vals=collect(sec);
  var off=document.querySelector('[data-devoff="'+sec+'"]');
  if(off)vals.disabled=off.classList.contains('on')?'1':'0';
  b.textContent='Menyimpan…';
  uciApplySec(sec,vals).then(function(){b.textContent='Simpan radio';refresh2()}).
   catch(function(){b.textContent='Simpan radio';msg('Gagal menyimpan')})})});
 document.querySelectorAll('[data-devoff]').forEach(function(t){t.addEventListener('click',function(){
  t.classList.toggle('on')})});
 document.querySelectorAll('[data-kick]').forEach(function(d){d.addEventListener('click',function(){
  var x=cache.leases[+d.dataset.kick];if(!x)return;
  if(!confirm('Putus '+ (x.hostname||x.mac) +' dari WiFi? Perangkat harus masuk ulang.'))return;
  var dev='wlan0',w=cache.wifi;
  for(var k in w){var r=w[k];
   if(r&&r.associated&&r.associated.some(function(a){return a.mac===x.mac})){dev=r['network-device']||dev;break}}
  sh(['iw','dev',dev,'station','del',x.mac]).
   then(function(){msg('Perangkat diputus');refresh2()}).
   catch(function(){msg('Kick gagal di '+dev)})})});
 var pg=$('#pingGo');
 if(pg)pg.addEventListener('click',function(){
  var host2=($('#pingHost').value||'8.8.8.8').trim();
  pg.textContent='Menunggu…';
  sh(['ping','-c','3','-w','8',host2]).then(function(out){
   pg.textContent='Ping 3×';var o=$('#pingOut');o.style.display='block';o.textContent=out||'(kosong)'}).
  catch(function(){pg.textContent='Ping 3×';msg('Ping gagal')})});
 document.querySelectorAll('[data-act]').forEach(function(a){a.addEventListener('click',function(){
  var k=a.dataset.act;
  if(k==='web')return App.openWeb();
  if(k==='host')return App.changeHost();
  if(k==='out')return App.goLogin();
  if(k==='reload')return confirm('Muat ulang WiFi? Koneksi nirkabel terputus ±5 detik.',function(){
   rpc('network.wireless','reload',{}).then(function(){msg('WiFi dimuat ulang');setTimeout(refresh2,3200)})});
  if(k==='reboot')return confirm('Reboot router? Semua perangkat terputus ±1 menit.',function(){
   msg('Mengirim perintah reboot…');rpc('system','reboot',{}).catch(function(){})})})})}

/* ===== shell aplikasi ===== */
function render(){
 $('#view').innerHTML=tab==='home'?screenHome():tab==='wifi'?screenWifi():
  tab==='net'?screenNet():tab==='dev'?screenDev():screenSys();
 bind()}
function buildTabs(){
 $('#tabs').innerHTML=TABS.map(function(t){
  return'<button class="tab'+(t[0]===tab?' on':'')+'" data-tab="'+t[0]+'">'+t[2]+t[1]+'</button>'}).join('');
 document.querySelectorAll('.tab').forEach(function(el){el.addEventListener('click',function(){
  if(tab===el.dataset.tab)return;
  tab=el.dataset.tab;history.replaceState(null,'','#'+tab);
  document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x.dataset.tab===tab)});
  $('#scrTitle').textContent=TITLES[tab];render();$('#view').scrollTop=0})})}
function refresh2(){
 loadAll().then(function(){
  setConn(!!cache.board);
  $('#scrSub').textContent=cache.board
   ?cache.board.hostname+' · '+((cache.board.release||{}).openwrt||'OpenWrt')
   :'perangkat tidak merespons';
  render()})}
function setConn(ok){var c=$('#conn');c.className='chip '+(ok?'on':'off');
 c.querySelector('span').textContent=ok?'ONLINE':'OFFLINE'}
buildTabs();
$('#scrTitle').textContent=TITLES[tab];
refresh2();
setInterval(function(){if(document.visibilityState==='visible')refresh2()},8000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')refresh2()});
</script>
