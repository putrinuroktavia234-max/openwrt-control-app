<style>

@font-face{font-family:'SG';src:url('fonts/sg-700.woff2') format('woff2');font-weight:700;font-display:swap}
:root{
 --ink:#091018;--surf:#0E1A28;--raise:#132238;--hair:rgba(120,170,255,.12);
 --t1:#EAF2FF;--t2:#8FA8CC;--t3:#6E89AB;

body{background:radial-gradient(120% 60% at 50% -10%, rgba(45,140,255,.14), transparent 60%),var(--ink);

 display:flex;align-items:flex-end;justify-content:space-between;gap:10px}

.top .sub{font-size:11.5px;font-weight:500;color:var(--t3);margin-top:3px;letter-spacing:.02em;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.chip{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:500;color:var(--t3);
 letter-spacing:.05em;padding:7px 11px;border:1px solid var(--hair);border-radius:99px;
 background:var(--surf);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--t3)}
.chip.on i{background:var(--ok);box-shadow:0 0 8px rgba(62,207,142,.6)}
.chip.on span{color:var(--t2)}
.chip.off i{background:var(--bad)}
.view{flex:1;overflow-y:auto;padding:4px 22px calc(100px + env(safe-area-inset-bottom));scrollbar-width:none}
.view::-webkit-scrollbar{display:none}

 padding:15px;margin-bottom:12px}

 border-bottom:1px solid var(--hair);font-size:13.5px;font-weight:500}
.row:last-child{border-bottom:none}
.row .k{color:var(--t2)}
.row .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ifc{border-left:2.5px solid var(--amber);padding-left:12px;margin-bottom:14px}

.tag{display:inline-block;font-size:9px;font-weight:500;letter-spacing:.05em;color:var(--amber);
 border:1px solid rgba(45,140,255,.35);border-radius:99px;padding:2.5px 8px;margin-left:7px;vertical-align:2px}
.tag.g{color:var(--ok);border-color:rgba(62,207,142,.35)}
.tag.r{color:var(--bad);border-color:rgba(255,95,109,.4)}

.dev:last-child{border-bottom:none}

 display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--t2)}
.dev .nm{font-size:13.5px;font-weight:700}
.dev .mc{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums;margin-top:2px}

.empty{padding:26px 8px;text-align:center;color:var(--t3);font-size:12.5px;font-weight:500;line-height:1.6}

.legend{display:flex;gap:14px;margin-top:8px;font-size:10.5px;font-weight:500;color:var(--t3);flex-wrap:wrap}

.rng button.on{color:var(--amber);border-color:rgba(45,140,255,.5);background:rgba(45,140,255,.1)}
.dev .st{font-size:10px;color:var(--t3);margin-top:2px}
.fld{margin-bottom:12px}

 border-radius:var(--r);height:48px;transition:border-color .18s}

 font:700 14px/1 'SG',sans-serif;padding:0 14px;min-width:0}
.fld input::placeholder{color:var(--t3);font-weight:500}

 transition:transform .08s;font-family:'SG',sans-serif}
.btn:active{transform:scale(.985)}

.act{display:flex;align-items:center;gap:12px;width:100%;background:var(--raise);border:1px solid var(--hair);

.act.d{color:var(--bad)}.act.d svg{stroke:var(--bad)}
.sub{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin:12px 0 8px}

.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
 background:rgba(9,16,24,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
 border-top:1px solid var(--hair);display:flex;padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;
 background:none;border:none;color:var(--t2);font:600 9.5px 'SG',sans-serif;cursor:pointer}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab svg.owmi{stroke:none;fill:currentColor}
.tab.on{color:var(--amber);text-shadow:0 0 14px rgba(45,140,255,.7)}

/* ===== data ===== */
function loadAll(){
 return Promise.allSettled([
  rpc('system','board',{}).then(function(r){cache.board=r}),
  rpc('network.wireless','status',{}).then(function(r){cache.wifi=r}),
  rpc('network.device','status',{}).then(function(r){cache.dev=r}),
  sh(['cat','/tmp/dhcp.leases']).then(function(s){cache.leases=parseLeases(s)}),
  sh(['cat','/proc/loadavg']).then(function(s){cache.load=(s||'').trim().split(/\s+/).slice(0,3).join(' / ')}),
  rpc('network.interface','dump',{}).then(function(r){
    cache.ifaces=(r&&r.interface)||[];
    return Promise.allSettled(cache.ifaces.map(function(i){
      return rpc('network.interface','status',{interface:i.interface}).
       then(function(s){cache.st[i.interface]=s})}))} ),
  sh(['uci','show','wireless']).then(function(s){cache.uci=parseUci(s)}),
  loadModem(), loadSrv(), loadDroid()
 ])}
function parseKV(txt){
 var o={};
 (txt||'').split('\n').forEach(function(l){
  var m=l.match(/^([\w._-]+)\s*=\s*'?(.*?)'?\s*$/);if(m)o[m[1]]=m[2]});
 return o}
/* ===== loader untuk kartu native ===== */
function loadNetMon(){
 return shell("cat /proc/net/dev | awk 'NR>2{print $1, $2, $3, $10, $11, $12}'").then(function(out){
  cache.netmon=(out||'').trim().split('\n').filter(Boolean).map(function(l){
   var p=l.trim().split(/\s+/);
   return{name:(p[0]||'').replace(/:/,''),rx:+p[1]||0,tx:+p[2]||0,rxpk:p[3],txpk:p[4],err:p[5],
    up:+p[1]>=0&&parseInt(p[2],10)>=0}})})
  .catch(function(){cache.netmon=[]})}
function loadDisks(){
 return shell("lsblk -rno NAME,SIZE,TYPE,MOUNTPOINT,FSTYPE,MODEL 2>/dev/null").then(function(out){
  cache.disks=(out||'').trim().split('\n').filter(Boolean).map(function(l){
   var p=l.trim().split(/\s+/);
   return{name:p[0],size:p[1],type:p[2],mount:p[3]&&p[3]!=='-'?p[3]:'',fs:p[4],
    model:(p.slice(5).join(' ')||'').replace(/\s+/g,' '),mounted:!!(p[3]&&p[3]!=='-')}})})
  .catch(function(){cache.disks=[]})}
function loadPkgs(){
 return shell("opkg list-installed 2>/dev/null | wc -l; echo ---; "
  +"opkg list-upgradable 2>/dev/null | wc -l").then(function(out){
   var p=(out||'').split('\n');cache.pkgs={n:+p[0]||0,upgradable:+p[2]||0}})
  .catch(function(){cache.pkgs=null})}
function loadMacTodong(){
 return sh(['sh','-c',
  "[ -r /etc/config/mac-todong ] && uci show mac-todong || echo NOTINSTALLED"]).then(function(out){
  var o=parseUci(out||''),macs=[],enabled=null,method=null;
  if(out.indexOf('NOTINSTALLED')>=0){cache.mtd={installed:false,macs:[]};return}
  enabled=(o['mac-todong']&&o['mac-todong'].enabled)==='1';
  method=(o['mac-todong']&&o['mac-todong'].method)||'firewall';
  Object.keys(o).forEach(function(sec){
   var c=o[sec];
   if(sec.indexOf('mac-todong.')!==0)return;
   if(c.macaddr){macs.push({mac:c.macaddr,
     hostname:(c.hostname||'').replace(/^'/,'').replace(/'$/,''),ip:c.ip||''})}});
  /* varian beda skema: list MAC di option macaddr tipe list */
  if(!macs.length){
   Object.keys(o).forEach(function(sec){var c=o[sec];
    if(sec.indexOf('mac-todong.')!==0)return;
    for(var k in c){if(/^mac/.test(k)&&/^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$/.test(c[k]))
     macs.push({mac:c[k],hostname:'',ip:''})}})}
  cache.mtd={installed:true,enabled:enabled,method:method,macs:macs}})
  .catch(function(){cache.mtd={installed:false,macs:[]}})}
function loadEqos(){
 return sh(['sh','-c',
  "[ -r /etc/config/eqosplus ] && uci show eqosplus || echo NOTINSTALLED"]).then(function(out){
  if(out.indexOf('NOTINSTALLED')>=0){cache.eqos=null;return}
  var o=parseUci(out||''),rules=[];
  Object.keys(o).forEach(function(sec){var c=o[sec];
   if(sec.indexOf('eqosplus.')!==0)return;
   if(c.__type==='eqosplus')return;
   if(c.mac||c.ip)rules.push({mac:c.mac||c.ip||'',down:c.download||'',up:c.upload||'',enable:c.enable})});
  cache.eqos={enabled:(o['eqosplus']&&o['eqosplus'].enabled)==='1',
   down:(o['eqosplus']&&o['eqosplus'].download)||'',up:(o['eqosplus']&&o['eqosplus'].upload)||'',
   rules:rules}})
  .catch(function(){cache.eqos=null})}
function loadVPN(){
 return Promise.allSettled([
  sh(['sh','-c',
   "[ -r /etc/config/openclash ] && uci show openclash || echo NOTINSTALLED"]),
  sh(['sh','-c',
   "which tailscale >/dev/null 2>&1 && tailscale status 2>/dev/null || echo NOTINSTALLED"])
 ]).then(function(r){
  var v={};
  var oc=(r[0]&&r[0].value)||'';
  if(oc.indexOf('NOTINSTALLED')<0){
   var o=parseUci(oc),g=o['openclash']||{};
   v.openclash={installed:true,
    running:cache.srv?!!cache.srv.openclash:false,
    mode:g.enhanced_mode||g['proxy_mode']||'',
    server:(function(){var s='';
     for(var k in o){if(/^openclash\./.test(k)&&o[k].__type==='servers'&&o[k].server){s=o[k].server;break}}
     return s||''})()}}
  else v.openclash={installed:false};
  var ts=(r[1]&&r[1].value)||'';
  if(ts.indexOf('NOTINSTALLED')<0){
   var m=ts.match(/^(\S+)\s+(\S+)\s+(\S+)/m);
   v.tailscale={installed:true,up:/active|connected/i.test(ts),
    name:m?m[1]:'',ip:m?m[2]:(ts.match(/100\.\d+/)||[])[0]||''}}
  else v.tailscale={installed:false};
  cache.vpn=v}).catch(function(){cache.vpn={}})}
function loadDroid(){
 return shell("ip -o link show 2>/dev/null | grep -iE 'rndis|cdc|ecm|usb' | awk -F': ' '{print $2}' | tr -d '@'").then(function(out){
  var names=(out||'').trim().split('\n').map(function(x){return x.trim()}).filter(Boolean);
  if(!names.length){cache.droid=null;return}
  return shell("ip -o addr show 2>/dev/null | grep -iE 'rndis|cdc|ecm|usb' | awk '{print $2, $4}'").then(function(a){
   var k={};(a||'').split('\n').forEach(function(l){
    var p=l.trim().split(/\s+/);if(p.length>1)k[p[0]]=p[1].split('/')[0]});
   return shell("cat /proc/net/dev").then(function(st){
    var st2={};(st||'').split('\n').forEach(function(l){
     var p=l.trim().split(/[:\s]+/);
     if(p.length>10)st2[p[0]]={rx:+p[1]||0,tx:+p[9]||0}});
    cache.droid=names.map(function(n){var t=st2[n]||{};
     return{name:n,up:true,ip:k[n]||'',rx:t.rx||0,tx:t.tx||0,
      mac:'USB tethering',driver:/rndis/.test(n)?'rndis':'usb-net'}})})})})
  .catch(function(){cache.droid=null})}
function loadAmlogic(){
 return sh(['sh','-c',
  "cat /proc/device-tree/model 2>/dev/null | tr -d '\0'; "
  +"echo '|'; ls -d /dev/mmcblk* /dev/nand* 2>/dev/null | tr '\n' ' '; "
  +"echo '|'; ls /usr/sbin/openwrt-install* /sbin/install* 2>/dev/null | head -1"]).then(function(out){
  var p=(out||'').split('|').map(function(x){return x.trim()});
  var soc=p[0]||'';
  if(!soc||!/meson|amlogic|s9|g12|sm1/i.test(soc)){cache.amlo=null;return}
  var emmc=/mmcblk\d$/.test(p[1].trim());
  cache.amlo={model:soc,soc:soc.replace(/^.*\//,''),
   emmc:emmc?'terdeteksi ('+p[1].trim().split(' ')[0]+')':'tidak ada',
   root:(p[1].trim().split(' ')[0]||'—'),boot:/emmc|mmc/i.test(p[1])?'eMMC':'SD/USB',
   uboot:'—',install:p[2]||''}})
  .catch(function(){cache.amlo=null})}
function loadTtyd(){
 return sh(['sh','-c',
  "[ -x /etc/init.d/ttyd ] && { /etc/init.d/ttyd running 2>/dev/null && echo UP || echo DOWN; } || echo NONE"]).then(function(out){
  out=(out||'').trim();
  if(out==='NONE'){cache.ttyd=null;return}
  cache.ttyd={up:out==='UP',port:7681}})
  .catch(function(){cache.ttyd=null})}

function loadModem(){
 return sh(['mmcli','-L']).then(function(out){
  if(!out||out.indexOf('not found')>=0||out.indexOf('no modems')>=0){cache.mm=null;return}
  var m=out.match(/Modem\/(\d+)/i);if(!m){cache.mm=null;return}
  var idx=m[1];
  return sh(['mmcli','-m',idx,'-K']).then(function(k){
   cache.mm={idx:idx,kv:parseKV(k),at:Date.now()}}).catch(function(){})})
  .catch(function(){})}
var SRV_LIST=['andromodem','openclash','tailscale','frps','zerotier','upnpd','docker','eqosplus','internet-detector','samba4','vsftpd','transmission'];
function loadSrv(){
 var js='';
 SRV_LIST.forEach(function(s){
  js+="[ -x /etc/init.d/"+s+" ] && { /etc/init.d/"+s+" running 2>/dev/null && echo "+s+":on || echo "+s+":off; };"});
 return sh(['sh','-c',js]).then(function(out){
  var r={};(out||'').split('\n').forEach(function(l){
   var m=l.trim().match(/^([\w.-]+):(on|off)$/);if(m)r[m[1]]=m[2]==='on'});
  cache.srv=r}).catch(function(){})}

/* ===== aksi ===== */
function q(s){return"'"+String(s).replace(/'/g,"'\\''")+"'"}
function uciApplySec(sec,vals,extra){
 var parts=[];
 for(var k in vals){if(vals[k]===undefined||vals[k]===null||vals[k]==='')continue;
  parts.push('uci set '+q(sec+'.'+k)+'='+q(vals[k]))}
 if(extra)parts=parts.concat(extra);
 if(!parts.length){msg('Tidak ada perubahan');return Promise.resolve()}
 parts.push('uci commit wireless','uci reapply wireless');
 return shell(parts.join(' && ')).then(function(){msg('Tersimpan & diterapkan')}).
  catch(function(){return shell(parts.slice(0,-1).concat(['uci commit wireless','/etc/init.d/network reload']).join(' && ')).then(function(){msg('Tersimpan (reload penuh)')})})}

function collect(sec){
 var vals={};
 document.querySelectorAll('[data-sec="'+sec+'"]').forEach(function(inp){vals[inp.dataset.opt]=inp.value});
 return vals}

/* ---- release RAM: echo 3 > drop_caches ---- */
function doRelRam(){
 sh(['sh','-c',
  "F=$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo); "
  +"echo 3 > /proc/sys/vm/drop_caches; sleep 1; "
  +"A=$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo); "
  +"echo \"$((A-F))\""]).then(function(out){

  var kb=parseInt((out||'').trim().split('\n').pop(),10);
  if(!isNaN(kb))cache.ram={freed:kb*1024};
  msg('Cache dibebaskan'+(!isNaN(kb)?': '+human(Math.abs(kb)*1024):''));
  refresh2()}).catch(function(){msg('Gagal melepaskan RAM')})}

/* ===== riwayat & grafik (localStorage, zero library) ===== */
var HIST={rows:[],max:400};
function histLoad(){try{HIST.rows=JSON.parse(localStorage.getItem('owrt_hist')||'[]')}catch(e){HIST.rows=[]}}


function histSave(){try{localStorage.setItem('owrt_hist',JSON.stringify(HIST.rows))}catch(e){}}
histLoad();
function histSample(){
 try{
  var wan=wanList()[0],s=wan?cache.st[wan.interface]||{}:{};
  var devN=cache.leases?cache.leases.length:0;
  var b=cache.board;
  var dl=s.data?s.data.rx_bytes:0,ul=s.data?s.data.tx_bytes:0;
  var mem=b?b.memory.total-(b.memory.free+(b.memory.buffers||0)+(b.memory.cached||0)):0;
  var sig=cache.mm&&cache.mm.kv?parseInt(cache.mm.kv['network.quality'],10):NaN;
  var cpu=cache.load?parseFloat(cache.load.split(' / ')[0]):NaN;
  var last=HIST.rows[HIST.rows.length-1];
  var t=Date.now(),row={t:t,dl:0,ul:0,sig:sig||0,mem:mem||0,dev:devN,cpu:cpu||0};
  if(last&&t-last.t>1500&&dl>=last._rdl){row.dl=Math.round((dl-last._rdl)*1000/(t-last.t));row.ul=Math.round((ul-last._rul)*1000/(t-last.t))}
  row._rdl=dl;row._rul=ul;
  if(last&&(dl<last._rdl||ul<last._rul)){/* counter reset: tandai jeda, jangan rate 0 palsu */
   row.gap=true}
  HIST.rows.push(row);
  if(HIST.rows.length>HIST.max)HIST.rows=HIST.rows.slice(-HIST.max);
  histSave();
 }catch(e){}}
var DEVH={};
try{DEVH=JSON.parse(localStorage.getItem('owrt_devhist')||'{}')}catch(e){}
if(location.search.indexOf('mock')>=0&&!Object.keys(DEVH).length){
 DEVH={'AA:BB:CC:77:88:99':{n:'Laptop-Kantor',i:'192.168.1.71',l:Date.now()-36e5*5},
 'AA:BB:CC:AA:BB:CC':{n:'ESP-SmartLamp',i:'192.168.1.88',l:Date.now()-36e5*26},
 'AA:BB:CC:11:99:00':{n:'Printer-HP',i:'192.168.1.92',l:Date.now()-36e5*70}}}
function devHistSave(){try{localStorage.setItem('owrt_devhist',JSON.stringify(DEVH))}catch(e){}}
function devHistUpdate(){
 if(!cache.leases)return;
 var now=Date.now(),changed=false;
 cache.leases.forEach(function(x){if(!x.mac)return;
  var d=DEVH[x.mac]||{f:now,n:'',i:''};
  if(x.hostname)d.n=x.hostname;
  if(x.ip)d.i=x.ip;
  d.l=now;d.c=(d.c||0)+1;
  DEVH[x.mac]=d;changed=true});
 if(changed)devHistSave()}
function ago(ts){var s=(Date.now()-ts)/1000;
 if(s<90)return'baru saja';if(s<3600)return Math.round(s/60)+' mnt lalu';
 if(s<86400)return Math.round(s/3600)+' jam lalu';return Math.round(s/86400)+' hari lalu'}
function humanBps(b){var u=['B/s','KB/s','MB/s','GB/s'],i=0;
 while(b>=1024&&i<3){b/=1024;i++}return(b>=100?Math.round(b):b.toFixed(1))+' '+u[i]}

function drawChart(cv,rows,key,color,fmt){
 var dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
 if(!W||!H)return;
 cv.width=W*dpr;cv.height=H*dpr;
 var g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,W,H);
 if(!rows||rows.length<2){g.fillStyle='#5d6065';g.font='11px SG,sans-serif';
  g.fillText('Mengumpulkan data…',12,H/2);return}
 var max=0,i;
 for(i=0;i<rows.length;i++)max=Math.max(max,rows[i][key]||0);
 max=max||1;max*=1.15;
 var pad=8,n=rows.length;
 function X(j){return pad+(W-pad*2)*j/(n-1)}
 function Y(v){return H-pad-(H-pad*2)*(v/max)}
 g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=1;
 for(i=1;i<4;i++){var y=H-pad-(H-pad*2)*i/4;g.beginPath();g.moveTo(pad,y);g.lineTo(W-pad,y);g.stroke()}
 g.beginPath();
 for(i=0;i<n;i++){var x=X(i),yy=Y(rows[i][key]||0);
  if(i===0)g.moveTo(x,yy);else g.lineTo(x,yy)}
 var grad=g.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,color+'55');grad.addColorStop(1,color+'05');
 g.lineTo(X(n-1),H-pad);g.lineTo(X(0),H-pad);g.closePath();
 g.fillStyle=grad;g.fill();
 g.beginPath();
 for(i=0;i<n;i++){var x2=X(i),y2=Y(rows[i][key]||0);
  if(i===0)g.moveTo(x2,y2);else g.lineTo(x2,y2)}
 g.strokeStyle=color;g.lineWidth=1.6;g.stroke();
 var lastV=rows[n-1][key]||0;
 g.fillStyle='#f2f1ee';g.font='bold 12px SG,sans-serif';
 g.fillText(fmt(lastV),pad+2,pad+13);
 g.fillStyle='#5d6065';g.font='9.5px SG,sans-serif';
 var mx=fmt(max);g.fillText(mx,W-pad-g.measureText(mx).width,pad+11);
 var t0=rows[0].t,t1=rows[n-1].t;
 var f=function(ts){var d=new Date(ts);return('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)};
 g.fillText(f(t0),pad,H-2);
 var mid=f(t0+(t1-t0)/2);g.fillText(mid,W/2-g.measureText(mid).width/2,H-2);
 g.fillText(f(t1),W-pad-g.measureText(f(t1)).width,H-2)}

function chartCard(title,rows,key,color,fmt,legend){
 return'<div class="card"><h3>'+esc(title)+'</h3>'+
 '<canvas class="chart" id="cv_'+key+'"></canvas>'+
 '<div class="legend">'+legend+'</div></div>'}
function drawAllCharts(){
 var r=HIST.rows;
 var cv=$('#cv_dl');if(cv)drawChart(cv,r,'dl','#2D8CFF',function(v){return humanBps(v)});
 var cv2=$('#cv_ul');if(cv2)drawChart(cv2,r,'ul','#2D8CFF',function(v){return humanBps(v)});
 var cv3=$('#cv_sig');if(cv3)drawChart(cv3,r,'sig','#3ECF8E',function(v){return Math.round(v)+'%'});
 var cv4=$('#cv_mem');if(cv4)drawChart(cv4,r,'mem','#7C6CFF',function(v){return human(v)});
 var cv5=$('#cv_dev');if(cv5)drawChart(cv5,r,'dev','#2D8CFF',function(v){return Math.round(v)+' perangkat'})}

function render(){
 /* jangan hapus input/textarea/pre yang sedang difokus pengguna */
 var ae=document.activeElement;
 if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')&&ae.closest('#view')){
  /* simpan & kembalikan fokus + posisi caret setelah render */
  var sel={id:ae.id||'',name:ae.name||'',type:ae.type||'',pos:ae.selectionStart};
  $('#view').innerHTML=tab==='home'?screenHome():tab==='wifi'?screenWifi():
   tab==='net'?screenNet():tab==='modem'?screenModem():tab==='dev'?screenDev():screenSys();
  bind();drawAllCharts();
  if(sel.id||sel.name){
   var q=sel.id?'#'+CSS.escape(sel.id):'#view [name="'+sel.name+'"]';
   var el=document.querySelector(q);
   if(el&&el.type===sel.type){el.focus();
    try{if(sel.pos!=null)el.setSelectionRange(sel.pos,sel.pos)}catch(e){}}}
  return}
 $('#view').innerHTML=tab==='home'?screenHome():tab==='wifi'?screenWifi():
  tab==='net'?screenNet():tab==='modem'?screenModem():tab==='dev'?screenDev():screenSys();
 bind();drawAllCharts()}
function buildTabs(){
 $('#tabs').innerHTML=TABS.map(function(t){
  return'<button class="tab'+(t[0]===tab?' on':'')+'" data-tab="'+t[0]+'">'+t[2]+t[1]+'</button>'}).join('');
 document.querySelectorAll('.tab').forEach(function(el){el.addEventListener('click',function(){
  if(tab===el.dataset.tab)return;
  tab=el.dataset.tab;history.replaceState(null,'','#'+tab);
  document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x.dataset.tab===tab)});
  $('#scrTitle').textContent=TITLES[tab];render();$('#view').scrollTop=0})})}
