:root{

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(120% 60% at 50% -10%, rgba(45,140,255,.14), transparent 60%),var(--ink);

.view{flex:1;overflow-y:auto;padding:4px 22px calc(100px + env(safe-area-inset-bottom));scrollbar-width:none}

 padding:15px;margin-bottom:12px}
.card h3{font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
 color:var(--t3);margin-bottom:10px}

.stat{background:var(--raise);border-radius:var(--r);padding:13px 14px}

 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

 border-bottom:1px solid var(--hair);font-size:13.5px;font-weight:500}
.row:last-child{border-bottom:none}
.row .k{color:var(--t2)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);

 background:none;border:none;color:var(--t2);font:600 9.5px 'SG',sans-serif;cursor:pointer}

function parseLeases(txt){
 if(!txt||txt.indexOf('No such')>=0)return[];
 return txt.trim().split('\n').filter(function(l){return l.trim()}).map(function(l){
  var p=l.trim().split(/\s+/);
  return{expires:+p[0],mac:p[1]||'',ip:p[2]||'',hostname:p[3]&&p[3]!=='*'?p[3]:''}})}
function parseUci(txt){
 var o={};
 (txt||'').split('\n').forEach(function(l){
  var m=l.match(/^(\w+)\.(\w+)(?:\.(\w+))?='([^']*)'$/);
  if(!m)return;
  var sec=m[1]+'.'+m[2];o[sec]=o[sec]||{};
  if(m[3])o[sec][m[3]]=m[4];else o[sec].__type=m[4]});
 return o}
function wanList(){return cache.ifaces.filter(function(i){
 var s=cache.st[i.interface];return s&&s.up&&(s.route||[]).some(function(r){return r.target==='0.0.0.0'})})}

function loadAll(){
 return Promise.allSettled([
  rpc('system','board',{}).then(function(r){cache.board=r}),
  rpc('network.wireless','status',{}).then(function(r){cache.wifi=r}),
  rpc('network.device','status',{}).then(function(r){cache.dev=r}),
  sh(['cat','/tmp/dhcp.leases']).then(function(s){cache.leases=parseLeases(s)}),
  sh(['cat','/proc/loadavg']).then(function(s){cache.load=(s||'').trim().split(/\s+/).slice(0,3).join(' / ')}),
  rpc('network.interface','dump',{}).then(function(r){
    cache.ifaces=(r&&r.interface)||[];
    return Promise.allSettled(cache.ifaces.map(function(i){
      return rpc('network.interface','status',{interface:i.interface}).
       then(function(s){cache.st[i.interface]=s})}))} ),
  sh(['uci','show','wireless']).then(function(s){cache.uci=parseUci(s)}),
  loadModem(), loadSrv()
 ])}
function parseKV(txt){
 var o={};
 (txt||'').split('\n').forEach(function(l){
  var m=l.match(/^([\w._-]+)\s*=\s*'?(.*?)'?\s*$/);if(m)o[m[1]]=m[2]});
 return o}
function loadModem(){
 return sh(['mmcli','-L']).then(function(out){
  if(!out||out.indexOf('not found')>=0||out.indexOf('no modems')>=0){cache.mm=null;return}
  var m=out.match(/Modem\/(\d+)/i);if(!m){cache.mm=null;return}
  var idx=m[1];
  return sh(['mmcli','-m',idx,'-K']).then(function(k){
   cache.mm={idx:idx,kv:parseKV(k),at:Date.now()}}).catch(function(){})})
  .catch(function(){})}
var SRV_LIST=['andromodem','openclash','tailscale','frps','zerotier','upnpd','docker','eqosplus','internet-detector','samba4','vsftpd','transmission'];
function loadSrv(){
 var js='';
 SRV_LIST.forEach(function(s){
  js+="[ -x /etc/init.d/"+s+" ] && { /etc/init.d/"+s+" running 2>/dev/null && echo "+s+":on || echo "+s+":off; };"});
 return sh(['sh','-c',js]).then(function(out){
  var r={};(out||'').split('\n').forEach(function(l){
   var m=l.trim().match(/^([\w.-]+):(on|off)$/);if(m)r[m[1]]=m[2]==='on'});
  cache.srv=r}).catch(function(){})}

/* ===== aksi ===== */
function q(s){return"'"+String(s).replace(/'/g,"'\\''")+"'"}
function uciApplySec(sec,vals,extra){
 var parts=[];
 for(var k in vals){if(vals[k]===undefined||vals[k]===null||vals[k]==='')continue;
  parts.push('uci set '+q(sec+'.'+k)+'='+q(vals[k]))}
 if(extra)parts=parts.concat(extra);
 if(!parts.length){msg('Tidak ada perubahan');return Promise.resolve()}
 parts.push('uci commit wireless','uci reapply wireless');
 return shell(parts.join(' && ')).then(function(){msg('Tersimpan & diterapkan')}).
  catch(function(){return shell(parts.slice(0,-1).concat(['uci commit wireless','/etc/init.d/network reload']).join(' && ')).
   then(function(){msg('Tersimpan (reload penuh)')})})}

function collect(sec){
 var vals={};
 document.querySelectorAll('[data-sec="'+sec+'"]').forEach(function(inp){vals[inp.dataset.opt]=inp.value});
 return vals}

function bind(){
 document.querySelectorAll('[data-radio]').forEach(function(t){t.addEventListener('click',function(){
  var k=t.dataset.radio,up=!t.classList.contains('on');t.classList.toggle('on',up);
  rpc('network.wireless',up?'up':'down',{interface:k}).
   then(function(){msg('Radio '+k+(up?' aktif':' dimatikan'));setTimeout(refresh2,1600)}).
   catch(function(){t.classList.toggle('on',!up);msg('Gagal mengubah radio')})})});
 document.querySelectorAll('[data-saveiface]').forEach(function(b){b.addEventListener('click',function(){
  if(b.disabled)return;b.disabled=true;b.textContent='Menyimpan…';
  uciApplySec(b.dataset.saveiface,collect(b.dataset.saveiface)).
   then(function(){b.textContent='Simpan perubahan';refresh2()}).
   catch(function(){b.textContent='Simpan perubahan';msg('Gagal menyimpan')}).
   finally(function(){b.disabled=false})})});
 document.querySelectorAll('[data-savedev]').forEach(function(b){b.addEventListener('click',function(){
  var sec=b.dataset.savedev,vals=collect(sec);
  var off=document.querySelector('[data-devoff="'+sec+'"]');
  if(off)vals.disabled=off.classList.contains('on')?'1':'0';
  if(b.disabled)return;b.disabled=true;b.textContent='Menyimpan…';
  uciApplySec(sec,vals).then(function(){b.textContent='Simpan radio';refresh2()}).
   catch(function(){b.textContent='Simpan radio';msg('Gagal menyimpan')}).
   finally(function(){b.disabled=false})})});
 document.querySelectorAll('[data-devoff]').forEach(function(t){t.addEventListener('click',function(){
  t.classList.toggle('on')})});
 document.querySelectorAll('[data-kick]').forEach(function(d){d.addEventListener('click',function(){
  var mac=d.dataset.kick,x=null;(cache.leases||[]).forEach(function(l){if(l.mac===mac)x=l});if(!x)return;
  askConfirm('Putus <b>'+esc(x.hostname||x.mac)+'</b> dari WiFi? Perangkat harus masuk ulang.',function(yn){if(!yn)return;doKick(x)})})});
/* kick perangkat berdasarkan MAC (bukan indeks: aman dari pergeseran refresh) */
function doKick(x){
 if(!x||!x.mac)return;
 var dev='wlan0',w=cache.wifi,onWifi=false;
 for(var k in w){var r=w[k];
  if(r&&r.associated&&r.associated.some(function(a){return a.mac===x.mac})){dev=r['network-device']||dev;onWifi=true;break}}
 if(!onWifi){msg(x.hostname||x.mac+' terhubung via kabel — tidak bisa diputus');return}
 sh(['iw','dev',dev,'station','del',x.mac]).
  then(function(){msg('Perangkat diputus');refresh2()}).
  catch(function(){msg('Kick gagal di '+dev)})}
 var pg=$('#pingGo');
 if(pg)pg.addEventListener('click',function(){
  var host2=($('#pingHost').value||'8.8.8.8').trim();
  pg.textContent='Menunggu…';
  sh(['ping','-c','3','-w','8',host2]).then(function(out){
   pg.textContent='Ping 3×';var o=$('#pingOut');o.style.display='block';o.textContent=out||'(kosong)'}).
  catch(function(){pg.textContent='Ping 3×';msg('Ping gagal')})});
 document.querySelectorAll('[data-web]').forEach(function(a){a.addEventListener('click',function(){
  try{App.openPage(a.dataset.web)}catch(e){msg('Tidak bisa membuka halaman')}})});
 document.querySelectorAll('[data-srv]').forEach(function(t){t.addEventListener('click',function(){
  var n=t.dataset.srv,want=!t.classList.contains('on');t.classList.toggle('on',want);
  sh(['/etc/init.d/'+n,want?'enable':'disable']).catch(function(){});
  sh(['/etc/init.d/'+n,want?'start':'stop']).then(function(){
    msg(n+(want?' dinyalakan':' dimatikan'));setTimeout(refresh2,1500)}).
   catch(function(){t.classList.toggle('on',!want);msg('Gagal mengubah '+n)})})});
 var rs=document.querySelector('[data-act="rescan"]');
 if(rs)rs.addEventListener('click',function(){rs.textContent='Memindai…';
  loadModem().then(function(){rs.textContent='Pindai ulang sinyal & status';render()}).
   catch(function(){rs.textContent='Pindai ulang sinyal & status'})});
 document.querySelectorAll('[data-act]').forEach(function(a){a.addEventListener('click',function(){
  var k=a.dataset.act;
  if(k==='rescan')return;
  if(k==='andro')return App.openAndro();
  if(k==='amsvc'){var on=cache.srv&&cache.srv.andromodem;
   sh(['/etc/init.d/andromodem',on?'stop':'start']).then(function(){msg('AndroModem '+(on?'dihentikan':'dinyalakan'));setTimeout(refresh2,1500)}).
    catch(function(){msg('Layanan andromodem tidak ada')});return}
  if(k==='web')return App.openWeb();
  if(k==='host')return App.changeHost();
  if(k==='out')return App.goLogin();
  if(k==='reload')return askConfirm('Muat ulang WiFi? Koneksi nirkabel terputus ±5 detik.',function(){
   rpc('network.wireless','reload',{}).then(function(){msg('WiFi dimuat ulang');setTimeout(refresh2,3200)})});
  if(k==='reboot')return askConfirm('Reboot router? Semua perangkat terputus ±1 menit.',function(){
   msg('Mengirim perintah reboot…');rpc('system','reboot',{}).catch(function(){})})})})}

/* ===== riwayat & grafik (localStorage, zero library) ===== */
var HIST={rows:[],max:400};
function histLoad(){try{HIST.rows=JSON.parse(localStorage.getItem('owrt_hist')||'[]')}catch(e){HIST.rows=[]}}
function histSave(){try{localStorage.setItem('owrt_hist',JSON.stringify(HIST.rows))}catch(e){}}
histLoad();
function histSample(){
 try{
  var wan=wanList()[0],s=wan?cache.st[wan.interface]||{}:{};
  var devN=cache.leases?cache.leases.length:0;
  var b=cache.board;
  var dl=s.data?s.data.rx_bytes:0,ul=s.data?s.data.tx_bytes:0;
  var mem=b?b.memory.total-(b.memory.free+(b.memory.buffers||0)+(b.memory.cached||0)):0;
  var sig=cache.mm&&cache.mm.kv?parseInt(cache.mm.kv['network.quality'],10):NaN;
  var cpu=cache.load?parseFloat(cache.load.split(' / ')[0]):NaN;
  var last=HIST.rows[HIST.rows.length-1];
  var t=Date.now(),row={t:t,dl:0,ul:0,sig:sig||0,mem:mem||0,dev:devN,cpu:cpu||0};
  if(last&&t-last.t>1500&&dl>=last._rdl){row.dl=Math.round((dl-last._rdl)*1000/(t-last.t));row.ul=Math.round((ul-last._rul)*1000/(t-last.t))}
  row._rdl=dl;row._rul=ul;
  if(last&&(dl<last._rdl||ul<last._rul)){/* counter reset: tandai jeda, jangan rate 0 palsu */
   row.gap=true}
  HIST.rows.push(row);
  if(HIST.rows.length>HIST.max)HIST.rows=HIST.rows.slice(-HIST.max);
  histSave();
 }catch(e){}}
var DEVH={};
try{DEVH=JSON.parse(localStorage.getItem('owrt_devhist')||'{}')}catch(e){}
if(location.search.indexOf('mock')>=0&&!Object.keys(DEVH).length){
 DEVH={'AA:BB:CC:77:88:99':{n:'Laptop-Kantor',i:'192.168.1.71',l:Date.now()-36e5*5},
 'AA:BB:CC:AA:BB:CC':{n:'ESP-SmartLamp',i:'192.168.1.88',l:Date.now()-36e5*26},
 'AA:BB:CC:11:99:00':{n:'Printer-HP',i:'192.168.1.92',l:Date.now()-36e5*70}}}
function devHistSave(){try{localStorage.setItem('owrt_devhist',JSON.stringify(DEVH))}catch(e){}}
function devHistUpdate(){
 if(!cache.leases)return;
 var now=Date.now(),changed=false;
 cache.leases.forEach(function(x){if(!x.mac)return;
  var d=DEVH[x.mac]||{f:now,n:'',i:''};
  if(x.hostname)d.n=x.hostname;
  if(x.ip)d.i=x.ip;
  d.l=now;d.c=(d.c||0)+1;
  DEVH[x.mac]=d;changed=true});
 if(changed)devHistSave()}
function ago(ts){var s=(Date.now()-ts)/1000;
 if(s<90)return'baru saja';if(s<3600)return Math.round(s/60)+' mnt lalu';
 if(s<86400)return Math.round(s/3600)+' jam lalu';return Math.round(s/86400)+' hari lalu'}
function humanBps(b){var u=['B/s','KB/s','MB/s','GB/s'],i=0;
 while(b>=1024&&i<3){b/=1024;i++}return(b>=100?Math.round(b):b.toFixed(1))+' '+u[i]}

function drawChart(cv,rows,key,color,fmt){
 var dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
 if(!W||!H)return;
 cv.width=W*dpr;cv.height=H*dpr;
 var g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,W,H);
 if(!rows||rows.length<2){g.fillStyle='#5d6065';g.font='11px SG,sans-serif';
  g.fillText('Mengumpulkan data…',12,H/2);return}
 var max=0,i;
 for(i=0;i<rows.length;i++)max=Math.max(max,rows[i][key]||0);
 max=max||1;max*=1.15;
 var pad=8,n=rows.length;
 function X(j){return pad+(W-pad*2)*j/(n-1)}
 function Y(v){return H-pad-(H-pad*2)*(v/max)}
 g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=1;
 for(i=1;i<4;i++){var y=H-pad-(H-pad*2)*i/4;g.beginPath();g.moveTo(pad,y);g.lineTo(W-pad,y);g.stroke()}
 g.beginPath();
 for(i=0;i<n;i++){var x=X(i),yy=Y(rows[i][key]||0);
  if(i===0)g.moveTo(x,yy);else g.lineTo(x,yy)}
 var grad=g.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,color+'55');grad.addColorStop(1,color+'05');
 g.lineTo(X(n-1),H-pad);g.lineTo(X(0),H-pad);g.closePath();
 g.fillStyle=grad;g.fill();
 g.beginPath();
 for(i=0;i<n;i++){var x2=X(i),y2=Y(rows[i][key]||0);
  if(i===0)g.moveTo(x2,y2);else g.lineTo(x2,y2)}
 g.strokeStyle=color;g.lineWidth=1.6;g.stroke();
 var lastV=rows[n-1][key]||0;
 g.fillStyle='#f2f1ee';g.font='bold 12px SG,sans-serif';
 g.fillText(fmt(lastV),pad+2,pad+13);
 g.fillStyle='#5d6065';g.font='9.5px SG,sans-serif';
 var mx=fmt(max);g.fillText(mx,W-pad-g.measureText(mx).width,pad+11);
 var t0=rows[0].t,t1=rows[n-1].t;
 var f=function(ts){var d=new Date(ts);return('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)};
 g.fillText(f(t0),pad,H-2);
 var mid=f(t0+(t1-t0)/2);g.fillText(mid,W/2-g.measureText(mid).width/2,H-2);
 g.fillText(f(t1),W-pad-g.measureText(f(t1)).width,H-2)}

function chartCard(title,rows,key,color,fmt,legend){
 return'<div class="card"><h3>'+esc(title)+'</h3>'+
 '<canvas class="chart" id="cv_'+key+'"></canvas>'+
 '<div class="legend">'+legend+'</div></div>'}
function drawAllCharts(){
 var r=HIST.rows;
 var cv=$('#cv_dl');if(cv)drawChart(cv,r,'dl','#2D8CFF',function(v){return humanBps(v)});
 var cv2=$('#cv_ul');if(cv2)drawChart(cv2,r,'ul','#2D8CFF',function(v){return humanBps(v)});
 var cv3=$('#cv_sig');if(cv3)drawChart(cv3,r,'sig','#3ECF8E',function(v){return Math.round(v)+'%'});
 var cv4=$('#cv_mem');if(cv4)drawChart(cv4,r,'mem','#7C6CFF',function(v){return human(v)});
 var cv5=$('#cv_dev');if(cv5)drawChart(cv5,r,'dev','#2D8CFF',function(v){return Math.round(v)+' perangkat'})}

/* ===== shell aplikasi ===== */
function render(){
 /* jangan hapus input/textarea/pre yang sedang difokus pengguna */
 var ae=document.activeElement;
 if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')&&ae.closest('#view')){
  /* simpan & kembalikan fokus + posisi caret setelah render */
  var sel={id:ae.id||'',name:ae.name||'',type:ae.type||'',pos:ae.selectionStart};
  $('#view').innerHTML=tab==='home'?screenHome():tab==='wifi'?screenWifi():
   tab==='net'?screenNet():tab==='modem'?screenModem():tab==='dev'?screenDev():screenSys();
  bind();drawAllCharts();
  if(sel.id||sel.name){
   var q=sel.id?'#'+CSS.escape(sel.id):'#view [name="'+sel.name+'"]';
   var el=document.querySelector(q);
   if(el&&el.type===sel.type){el.focus();
    try{if(sel.pos!=null)el.setSelectionRange(sel.pos,sel.pos)}catch(e){}}}
  return}
 $('#view').innerHTML=tab==='home'?screenHome():tab==='wifi'?screenWifi():
  tab==='net'?screenNet():tab==='modem'?screenModem():tab==='dev'?screenDev():screenSys();
 bind();drawAllCharts()}
function buildTabs(){
 $('#tabs').innerHTML=TABS.map(function(t){
  return'<button class="tab'+(t[0]===tab?' on':'')+'" data-tab="'+t[0]+'">'+t[2]+t[1]+'</button>'}).join('');
 document.querySelectorAll('.tab').forEach(function(el){el.addEventListener('click',function(){
  if(tab===el.dataset.tab)return;
  tab=el.dataset.tab;history.replaceState(null,'','#'+tab);
  document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x.dataset.tab===tab)});
  $('#scrTitle').textContent=TITLES[tab];render();$('#view').scrollTop=0})})}
var _busy=false;
function refresh2(){
 if(_busy)return;_busy=true;
 loadAll().then(function(){
  histSample();devHistUpdate();
  setConn(!!cache.board);
  $('#scrSub').textContent=cache.board
   ?cache.board.hostname+' · '+((cache.board.release||{}).openwrt||'OpenWrt')
   :'perangkat tidak merespons';
  render();drawAllCharts()})['finally'](function(){_busy=false})}
function setConn(ok){var c=$('#conn');c.className='chip '+(ok?'on':'off');
 c.querySelector('span').textContent=ok?'ONLINE':'OFFLINE'}
buildTabs();
$('#scrTitle').textContent=TITLES[tab];
refresh2();
setInterval(function(){if(document.visibilityState==='visible')refresh2()},8000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')refresh2()});
