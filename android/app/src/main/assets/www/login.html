<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>OpenWrt Control</title>
<style>
@font-face{font-family:'SG';src:url('fonts/sg-500.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'SG';src:url('fonts/sg-700.woff2') format('woff2');font-weight:700;font-display:swap}

:root{
  --ink:#0c0d10;
  --device:#17181d;
  --raise:#1e2026;
  --hair:rgba(255,255,255,.075);
  --text-1:#f2f1ee;
  --text-2:#9b9d9f;
  --text-3:#5d6065;
  --amber:#e9b44c;
  --amber-deep:#d49f33;
  --led:#8fc98a;
  --r-ctl:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ink);font-family:'SG',system-ui,sans-serif;color:var(--text-1);
  display:flex;align-items:stretch;justify-content:center}
.stage{width:100%;max-width:430px;display:flex;flex-direction:column;position:relative;
  background:
   radial-gradient(120% 55% at 50% -8%, rgba(233,180,76,.055), transparent 60%),
   var(--ink)}

.deck{flex:0 0 auto;padding:30px 26px 30px;position:relative}
.toprow{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.led{display:flex;align-items:center;gap:7px}
.led i{width:7px;height:7px;border-radius:50%;background:var(--led);
  box-shadow:0 0 0 0 rgba(143,201,138,.5);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(143,201,138,.45)}
  70%{box-shadow:0 0 0 9px rgba(143,201,138,0)}
  100%{box-shadow:0 0 0 0 rgba(143,201,138,0)}}
.led span{font-size:10.5px;font-weight:500;color:var(--text-3);letter-spacing:.04em}
.mark{width:46px;height:46px;border-radius:13px;background:linear-gradient(160deg,var(--raise),#14151a);
  border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}
.mark svg{width:24px;height:24px;stroke:var(--amber);fill:none;stroke-width:1.7;stroke-linecap:round}
.deck h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.08}
.deck p{font-size:13.5px;font-weight:500;color:var(--text-2);margin-top:8px;max-width:26ch;line-height:1.45}
.meta{display:flex;justify-content:space-between;margin-top:24px}
.meta div{font-size:10.5px;font-weight:500;color:var(--text-3);letter-spacing:.07em;text-transform:uppercase}
.meta b{display:block;font-size:13.5px;font-weight:700;color:var(--text-1);letter-spacing:0;margin-top:4px;
  font-variant-numeric:tabular-nums}
.meta div:last-child{text-align:right}

.sheet{flex:0 0 auto;margin-top:auto;background:var(--device);border-radius:26px 26px 0 0;
  border:1px solid var(--hair);border-bottom:none;
  padding:34px 26px calc(28px + env(safe-area-inset-bottom));position:relative;
  box-shadow:0 -14px 40px rgba(0,0,0,.5)}
.grab{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:34px;height:4px;
  border-radius:2px;background:rgba(255,255,255,.14)}
.f{margin-bottom:26px}
.f label{display:block;font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--text-3);
  text-transform:uppercase;margin-bottom:10px}
.f .in{display:flex;align-items:center;background:var(--raise);border:1px solid transparent;
  border-radius:var(--r-ctl);height:54px;transition:border-color .18s,background .18s}
.f .in:focus-within{border-color:rgba(233,180,76,.55);background:#22242b}
.f input{flex:1;background:none;border:none;outline:none;color:var(--text-1);
  font:700 15.5px/1 'SG',sans-serif;letter-spacing:.01em;padding:0 16px;min-width:0;
  font-variant-numeric:tabular-nums}
.f input::placeholder{color:var(--text-3);font-weight:500}
.eye{width:52px;align-self:stretch;display:flex;align-items:center;justify-content:center;
  border:none;background:none;cursor:pointer}
.eye svg{width:19px;height:19px;stroke:#a9abaf;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.eye.on svg{stroke:var(--amber)}
.eye .slash{display:block}
.eye.on .slash{display:none}

.btn{width:100%;height:56px;border:none;border-radius:var(--r-ctl);cursor:pointer;
  background:linear-gradient(180deg,var(--amber),var(--amber-deep));color:#191510;
  font:700 15px 'SG',sans-serif;letter-spacing:.02em;margin-top:6px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(0,0,0,.15);
  transition:transform .08s ease, filter .18s}
.btn:active{transform:scale(.985)}
.btn[disabled]{filter:saturate(.25) brightness(.8);transform:none}

.foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;min-height:20px}
.link{font-size:12.5px;font-weight:500;color:var(--text-2);text-decoration:none;padding:6px 2px}
.link b{color:var(--text-1);font-weight:700}
.msg{font-size:12px;font-weight:500;color:#e0807f}

@media (prefers-reduced-motion:reduce){
  .led i{animation:none}
  .btn{transition:none}}
</style></head><body>
<div class="stage">

  <header class="deck">
    <div class="toprow">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M4 9a11.5 11.5 0 0 1 16 0M7.2 12.4a7 7 0 0 1 9.6 0M10.4 15.6a2.6 2.6 0 0 1 3.2 0"/>
          <circle cx="12" cy="18.6" r=".9" fill="var(--amber)" stroke="none"/>
        </svg>
      </div>
      <div class="led"><i></i><span>LAN ONLINE</span></div>
    </div>
    <h1>Masuk ke<br>router Anda</h1>
    <p>Kredensial disimpan di perangkat ini dan diisi ulang otomatis tiap sesi.</p>
    <div class="meta">
      <div>Perangkat<b>STB · OpenWrt</b></div>
      <div>Gateway<b id="hostLabel">192.168.1.1</b></div>
    </div>
  </header>

  <section class="sheet">
    <div class="grab"></div>
    <form id="f" autocomplete="off">
      <div class="f">
        <label for="user">Nama pengguna</label>
        <div class="in"><input id="user" placeholder="mis. root" autocapitalize="none" autocorrect="off"></div>
      </div>
      <div class="f">
        <label for="pass">Kata sandi</label>
        <div class="in">
          <input id="pass" type="password" placeholder="••••••••">
          <button type="button" class="eye" id="eye" aria-label="Tampilkan sandi">
            <svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3.1"/><path class="slash" d="M4 20 20 4"/></svg>
          </button>
        </div>
      </div>
      <button class="btn" id="go" type="submit">Masuk</button>
      <div class="foot">
        <a href="#" class="link" id="skip">Lewati, <b>buka langsung <svg width="12" height="12" viewBox="0 0 24 24" style="vertical-align:-1px"><path d="M4 12h14M13 6l6 6-6 6" stroke="#f2f1ee" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></b></a>
        <a href="#" class="link" id="hostBtn">Ganti IP</a>
      </div>
    </form>
  </section>

</div>
<script>
var us=document.getElementById('user'),pw=document.getElementById('pass'),
    go=document.getElementById('go'),eye=document.getElementById('eye'),
    foot=document.querySelector('.foot'),hostLabel=document.getElementById('hostLabel');
try{var s=App.getSaved();if(s){var j=JSON.parse(s);us.value=j.u==='root'?'':(j.u||'');pw.value=j.p||'';
    if(j.h)hostLabel.textContent=String(j.h).replace(/^https?:\/\//,'');}}catch(e){}
function showErr(txt){var old=document.querySelector('.msg');if(old)old.remove();
 var d=document.createElement('span');d.className='msg';d.textContent=txt;foot.prepend(d);
 go.disabled=false;go.textContent='Masuk'}
window.__loginFail=showErr;
if(location.search.indexOf('err=1')>=0)showErr('Router tidak terjangkau');
if(location.search.indexOf('err=2')>=0)showErr('Sesi kedaluwarsa — masuk ulang');
if(location.search.indexOf('back=1')>=0)showErr('Keluar dari dashboard. Masuk untuk lanjut.');
eye.addEventListener('click',function(){var show=pw.type==='password';pw.type=show?'text':'password';
 eye.classList.toggle('on',show);pw.focus();});
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();
 go.disabled=true;go.textContent='Menghubungkan…';
 try{App.login(us.value.trim()||'root',pw.value)}
 catch(e){showErr('Jembatan aplikasi tidak aktif')}});
document.getElementById('skip').addEventListener('click',function(ev){ev.preventDefault();
 try{App.skip()}catch(e){showErr('Jembatan aplikasi tidak aktif')}});
document.getElementById('hostBtn').addEventListener('click',function(ev){ev.preventDefault();
 try{App.changeHost()}catch(e){}});
</script>
</body></html>
